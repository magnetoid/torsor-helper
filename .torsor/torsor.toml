version = 1

[budgets]
bootstrap_tokens = 2000
recall_tokens = 1500
chars_per_token = 4

[embeddings]
# "fastembed" when the [embeddings] extra is installed; this repo's own index runs on the hashing fallback.
provider = "hashing"
model = "BAAI/bge-small-en-v1.5"
dim = 384

[index]
rrf_k = 60
recency_weight = 0.1
graph_boost = 0.1
auto_index = true
