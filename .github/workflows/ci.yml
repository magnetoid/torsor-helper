name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        # The pinned ruff from the dev extra, not `--with ruff`, which resolves
        # whatever is newest — its default rule selection has changed under this
        # repo before, turning CI red with no code change.
        run: uv run --extra dev ruff check src tests
      - name: Types
        run: uv run --extra dev mypy src/torsor_helper

      - name: Test (no extras — proves degradation)
        # --exact prunes anything a previous step installed, so this really is a
        # no-[languages] environment rather than the union of both steps' deps.
        run: uv run --exact --extra dev pytest -q
      - name: Test (with languages extra)
        run: uv run --extra dev --extra languages pytest -q -n auto --cov --cov-report=term --cov-fail-under=88

      - name: Dogfood the guard
        # Explicit file list: the default is git-changed files, which on a clean
        # checkout is empty — so a bare `guard --strict` checks nothing and
        # passes. That is how a real violation here survived a green CI run.
        run: uv run torsor guard --strict $(git ls-files '*.py')

      - name: The built wheel must install and run
        run: |
          set -euo pipefail
          uv build
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/torsor --version
