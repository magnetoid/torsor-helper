name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: uv run --with ruff ruff check src tests
      - name: Test (no extras — proves degradation)
        # --exact prunes anything a previous step installed, so this really is a
        # no-[languages] environment rather than the union of both steps' deps.
        run: uv run --exact --extra dev pytest -q
      - name: Test (with languages extra)
        run: uv run --extra dev --extra languages pytest -q

      - name: Dogfood the guard
        # Explicit file list: the default is git-changed files, which on a clean
        # checkout is empty — so a bare `guard --strict` checks nothing and
        # passes. That is how a real violation here survived a green CI run.
        run: uv run torsor guard --strict $(git ls-files '*.py')

      - name: The built wheel must install and run
        run: |
          set -euo pipefail
          uv build
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/torsor --version
