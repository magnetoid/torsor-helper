[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torsor-helper"
dynamic = ["version"]
description = "Persistent memory + architectural-intent guardrail for AI coding agents, over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "anyio>=4.0"]
embeddings = ["fastembed>=0.3"]

[project.scripts]
torsor = "torsor_helper.cli:main"

[tool.hatch.version]
path = "src/torsor_helper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/torsor_helper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E731 (lambda-assignment) is intentionally allowed: test fixtures use
# `CLOCK = lambda: datetime(...)` as injectable clocks, which is clearer
# inline than a def.
ignore = ["E731"]
