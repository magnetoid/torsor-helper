[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torsor-helper"
dynamic = ["version"]
description = "Persistent memory + architectural-intent guardrail for AI coding agents, over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marko Tiosavljevic", email = "marko.tiosavljevic@gmail.com" }]
keywords = ["mcp", "ai", "coding-agent", "memory", "context-engineering", "llm", "rag", "architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",
    "Environment :: Console",
]
dependencies = [
    # <2: mcp 2.x removed mcp.server.fastmcp (renamed MCPServer) — migrate deliberately, not by resolve.
    "mcp>=1.2.0,<3",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
    # Pinned, not floated: CI used `uv run --with ruff`, which resolves whatever
    # is newest, and ruff's default rule selection has changed under this repo
    # before. Local and CI must lint identically.
    "ruff==0.16.8",
    "pytest-cov>=5.0",
    # The suite has no chdir, no env-var config and no wall-clock dependency, so
    # it parallelizes; -n auto roughly halves it.
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "mypy>=1.11",
]
embeddings = ["fastembed>=0.3"]
languages = [
    "tree-sitter>=0.25",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
]

[project.scripts]
torsor = "torsor_helper.cli:main"

[project.urls]
Homepage = "https://github.com/magnetoid/torsor-helper"
Repository = "https://github.com/magnetoid/torsor-helper"
Changelog = "https://github.com/magnetoid/torsor-helper/blob/main/CHANGELOG.md"
Issues = "https://github.com/magnetoid/torsor-helper/issues"

[tool.hatch.version]
path = "src/torsor_helper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/torsor_helper"]
# py.typed ships the annotations: without it a consumer importing torsor_helper
# gets Any for everything, despite the package being fully annotated.
artifacts = ["src/torsor_helper/py.typed"]

[tool.hatch.build.targets.sdist]
# Keep the sdist lean: ship src + README/LICENSE/CHANGELOG/pyproject (+ tests),
# not the dogfooded .torsor/ memory, internal planning docs, or CI config.
exclude = [".torsor", "docs", ".github", ".gitignore"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "slow: spawns a subprocess or binds a port (the end-to-end transports)",
]

[tool.mypy]
# No python_version pin: it makes mypy parse installed stubs under that version,
# and numpy's use 3.12 syntax. The CI matrix covers the versions instead.
ignore_missing_imports = true      # the tree-sitter grammar wheels ship no stubs
# Deliberately not --strict: this is a ratchet, not a rewrite. It already found
# three real bugs at this level (an int parameter rebound to a float, a Typer
# option unpacked without checking both halves, a dedupe that worked only
# because set.add returns None). Raise it when the next batch is worth fixing.
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# The one module whose imports are conditional by design (ADR 0013: treesitter.py
# is the only place that touches tree_sitter, so degradation lives in one place).
# Its `type: ignore`s are needed when the `languages` extra IS installed and are
# unused when it is not — so with this on, mypy's verdict depended on the state
# of whoever's virtualenv it ran in. It passed locally, where the extra had been
# synced in by an earlier test run, and failed in CI, which installs only `dev`.
# Every other check still applies to this module; only the unused-ignore warning
# is dropped, and the result no longer depends on how the venv was last used.
module = "torsor_helper.languages.treesitter"
warn_unused_ignores = false

[tool.coverage.run]
source = ["src/torsor_helper"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's *default* selection expanded in 0.16 and
# an unpinned `uv run --with ruff` would otherwise fail CI on rules this repo
# never adopted (DTZ, BLE, FURB, UP…). These are ruff's classic defaults.
select = ["E4", "E7", "E9", "F"]
# E731 (lambda-assignment) is intentionally allowed: test fixtures use
# `CLOCK = lambda: datetime(...)` as injectable clocks, which is clearer
# inline than a def.
ignore = ["E731"]
