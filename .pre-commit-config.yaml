# The gates this project ships, pointed at itself. `pre-commit install` once.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --extra dev ruff check --fix
        language: system
        types: [python]

      - id: torsor-guard
        name: torsor guard (architectural drift)
        # Only the staged files, which is what the guard is for on a commit —
        # and unlike the bare default, this list is never empty here.
        entry: uv run torsor guard --strict
        language: system
        types: [python]

      - id: torsor-deps
        name: torsor deps (phantom imports)
        entry: uv run torsor deps --strict
        language: system
        types: [python]
